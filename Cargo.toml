[workspace]
members = [
    "ftml-ts/rs",
    "ftml-backend/rs"
]
resolver = "3"

[profile.release]
panic = "abort"
# debug = "full"
codegen-units = 1
overflow-checks = false
split-debuginfo = "packed"
strip = "symbols"
opt-level = 'z'
lto = true
incremental = true

[profile.dev]
strip = "none"
opt-level = 2
debug = true
split-debuginfo = "off"
debug-assertions = true
overflow-checks = true
lto = false
panic = 'unwind'
incremental = true
#codegen-units = 256
rpath = false

[workspace.lints.clippy]
enum_glob_use = "deny"
pedantic = "deny"
nursery = "deny"
unwrap_used = "deny"

[workspace.dependencies]
ftml-viewer = { git = "https://github.com/FlexiFormal/FTML" }
ftml-backend = { git = "https://github.com/FlexiFormal/FTML", features=["typescript"] }
ftml-uris = { git = "https://github.com/FlexiFormal/FTML" }
ftml-ontology = { git = "https://github.com/FlexiFormal/FTML" }
ftml-dom = { git = "https://github.com/FlexiFormal/FTML", features=["csr","typescript"] }
ftml-components = { git = "https://github.com/FlexiFormal/FTML", features=["csr","typescript","callbacks"] }
ftml-js-utils = { git = "https://github.com/FlexiFormal/FTML" }
leptos-react = { git = "https://github.com/FlexiFormal/FTML", features=["csr","typescript"] }

#ftml-viewer = { path="../FTML/viewer" }
#ftml-backend = { path="../FTML/backend",features=["typescript"] }
#ftml-uris = { path="../FTML/uris" }
#ftml-ontology = { path="../FTML/ontology" }
#ftml-dom = { path="../FTML/dom", features=["csr","typescript"]}
#ftml-components = { path="../FTML/components", features=["csr","typescript","callbacks"]}
#ftml-js-utils = { path="../FTML/js-utils" }
#leptos-react = { path="../FTML/leptos-react", features=["csr","typescript"]}

leptos-posthoc = "0.2" #{ git = "https://github.com/FlexiFormal/leptos-posthoc.git", features=["csr"] }

flams-backend-types = { git = "https://github.com/FlexiFormal/FLAMS.git", features=["typescript"] } 
#flams-backend-types = { path="../FLAMS/backend-types", features=["typescript"]}

wasm-bindgen = "0.2"
leptos = { version = "0.8",features=["csr"] }
tracing = "0.1"
tracing-subscriber = "0.3"
console_error_panic_hook = "0.1"
tracing-wasm = { version = "0.2" }
tsify = { version = "0.5", features = ["js"] }
serde = { version = "1" }
